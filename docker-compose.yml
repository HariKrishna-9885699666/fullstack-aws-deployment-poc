version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: fileflow-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fileflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fileflow_pass}
      POSTGRES_DB: ${POSTGRES_DB:-fileflow}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autocomplete_usr -d autocomplete_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fileflow-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  localstack:
    image: localstack/localstack:latest
    container_name: fileflow-localstack
    environment:
      - SERVICES=s3,sqs
      - DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    ports:
      - "4566:4566"
    volumes:
      - "${LOCALSTACK_VOLUME_DIR:-./.localstack}:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"

volumes:
  postgres_data:
  redis_data:
